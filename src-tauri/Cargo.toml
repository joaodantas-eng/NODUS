[package]
name = "produtividade"
version = "0.1.0"
description = "Aplicativo desktop para macOS de Produtividade"
authors = ["Produtividade"]
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
